    <style>
      :root {
        --bg: #f7fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --primary: #253a8a;
        --primary-soft: #ebf1ff;
      }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Inter, Arial, sans-serif; background: var(--bg); color: var(--text); }
      .site-header { position: sticky; top:0; z-index:1000; background: linear-gradient(90deg, #0f172a, #162a4f); color:#fff; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.12); }
      .site-header .container { display:flex; align-items:center; justify-content:center; position:relative; }
      .site-header .logo { position:absolute; left:16px; top:50%; transform:translateY(-50%); background:#fff; color:#1d2a4e; border-radius:999px; padding:8px 12px; font-weight:700; text-decoration:none; box-shadow:0 5px 14px rgba(0,0,0,0.15);}      
      .site-header h1 { margin:0; font-size:2.2rem; letter-spacing:-0.5px; }
      main.container { width:min(94%,1100px); margin: 20px auto 35px; }

      .novidades-page-header { background: white; border: 1px solid #dde4f2; border-radius: 14px; padding: 18px 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); margin-bottom: 20px; }
      .novidades-page-header .tag { margin:0; color:#ff7a00; font-weight:700; font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; }
      .novidades-page-header h2 { margin: 8px 0 6px; font-size: 2rem; color:#111827; text-align:center; }
      .novidades-page-header .tagline { margin:0; color:#475569; text-align:center; font-size:0.95rem; }

      .novidades-section { background:#fff; border:1px solid #e4e8f0; border-radius:12px; padding:18px; box-shadow:0 6px 18px rgba(0,0,0,0.05); margin-bottom:24px; }
      .novidades-section h2 { margin:0 0 12px; text-align:center; font-size:1.8rem; color:#0f172a; letter-spacing:-0.2px; }

      .carousel { position:relative; width:100%; max-width:1000px; margin:0 auto 22px; overflow:hidden; border-radius:12px; background:#090b11; border:1px solid #1e293b; min-height:260px; }
      .carousel-container { width:100%; height:100%; position:relative; }
      .carousel-item { position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; display:flex; align-items:center; justify-content:center; transition:opacity .3s ease; }
      .carousel-item.active { opacity:1; z-index:2; }
      .carousel-item img { width:100%; height:100%; object-fit:cover; border-radius:10px; }

      .carousel-control { position:absolute; top:50%; transform:translateY(-50%); border:none; background:rgba(15,23,42,0.8); color:#fff; width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:1.1rem; z-index:10; box-shadow:0 6px 16px rgba(0,0,0,0.25); }
      .carousel-control.prev { left:10px; }
      .carousel-control.next { right:10px; }
      .carousel-control:hover { background: rgba(15,23,42,0.95); }

      .section-divider { height:1px; background:#e2e8f0; margin: 14px 0 20px; border:none; }

      @media (max-width:900px) { .site-header h1 { font-size:1.6rem; } .carousel { min-height:220px; } }
      @media (max-width:640px) { .site-header .logo { position:static; transform:none; margin-bottom:8px; } .site-header .container { justify-content:center; } .novidades-page-header, .novidades-section { padding:14px; } .novidades-page-header h2 { font-size:1.55rem; } .novidades-section h2 { font-size:1.5rem; } }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".carousel").forEach((carousel) => {
          const items = carousel.querySelectorAll(".carousel-item");
          const prevButton = carousel.querySelector(".carousel-control.prev");
          const nextButton = carousel.querySelector(".carousel-control.next");
          let currentIndex = 0;

          const update = () => {
            items.forEach((item, idx) =>
              item.classList.toggle("active", idx === currentIndex),
            );
          };

          if (!items.length) return;

          prevButton.addEventListener("click", () => {
            currentIndex =
              currentIndex > 0 ? currentIndex - 1 : items.length - 1;
            update();
          });

          nextButton.addEventListener("click", () => {
            currentIndex =
              currentIndex < items.length - 1 ? currentIndex + 1 : 0;
            update();
          });

          update();
        });
      });
    </script>
