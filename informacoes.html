    <style>
      .carousel {
        position: relative;
        width: 100%;
        max-width: 1000px;
        margin: 0 auto 24px;
        overflow: hidden;
        height: 360px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        background: #000;
      }
      .carousel-container {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .carousel-item {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 0.4s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .carousel-item.active {
        opacity: 1;
        z-index: 1;
      }
      .carousel-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 10px;
      }
      .carousel-control {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background-color: rgba(0, 0, 0, 0.45);
        color: #fff;
        border: none;
        padding: 10px 14px;
        cursor: pointer;
        z-index: 10;
        font-size: 28px;
        border-radius: 999px;
        transition: background 0.15s ease;
      }
      .carousel-control.prev { left: 12px; }
      .carousel-control.next { right: 12px; }
      .carousel-control:hover { background-color: rgba(0, 0, 0, 0.7); }

      .novidades-page-header {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 14px 18px;
        margin-bottom: 18px;
        box-shadow: 0 3px 16px rgba(0, 0, 0, 0.06);
      }
      .novidades-page-header .tag {
        margin: 0;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ff7a00;
        font-weight: 700;
      }
      .novidades-page-header h2 {
        margin: 8px 0 6px;
        font-size: 1.4rem;
        color: #0f172a;
      }
      .novidades-page-header .tagline {
        margin: 0;
        color: #475569;
        font-size: 0.95rem;
      }
      .novidades-section {
        background: #fff;
        border-radius: 10px;
        padding: 16px;
        border: 1px solid #000000;
        margin-bottom: 20px;
      }
      .novidades-section h2 {

        font-size: 1.9rem;
        color: #111827;
        text-align: center;
        font-weight: 800;
        letter-spacing: -0.2px;
      }
      .carousel {
        position: relative;
        width: 100%;
        max-width: 1000px;
        margin: 0 auto 28px;
        overflow: hidden;
        height: 330px;
        border-radius: 14px;
        border: none;
        background: #111;

      .carousel-control {

        background: rgba(0,0,0,0.42);

      .carousel-control:hover { background-color: rgba(0, 0, 0, 0.7); }

      .novidades-page-header {

        font-size: 2rem;

      @media (max-width: 900px) {
        .site-header .container { flex-wrap: wrap; justify-content: center; }
        .site-header h1 { font-size: 1.15rem; }
        .carousel { height: 280px; }
      }
      @media (max-width: 640px) {
        .novidades-section { padding: 14px; }
        .carousel { height: 220px; }
        .site-header .logo { position: static; }
      }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".carousel").forEach((carousel) => {
          const items = carousel.querySelectorAll(".carousel-item");
          const prevButton = carousel.querySelector(".carousel-control.prev");
          const nextButton = carousel.querySelector(".carousel-control.next");
          let currentIndex = 0;

          const update = () => {
            items.forEach((item, idx) =>
              item.classList.toggle("active", idx === currentIndex),
            );
          };

          if (!items.length) return;

          prevButton.addEventListener("click", () => {
            currentIndex =
              currentIndex > 0 ? currentIndex - 1 : items.length - 1;
            update();
          });

          nextButton.addEventListener("click", () => {
            currentIndex =
              currentIndex < items.length - 1 ? currentIndex + 1 : 0;
            update();
          });

          update();
        });
      });
    </script>
